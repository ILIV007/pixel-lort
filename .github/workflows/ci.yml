name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

# Least privilege: CI only needs to read the repository. It never deploys.
permissions:
  contents: read

jobs:
  check:
    name: Phase 0 quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete quality gate (lint, format, typecheck, tests, secret scan, build)
        run: npm run check
